<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Words to Time Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 10px;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            color: #333;
            font-size: 24px;
            font-weight: bold;
        }

        .time-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        .time-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .time-value {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .reading-speed {
            font-size: 12px;
            opacity: 0.8;
        }

        .clear-btn {
            width: 100%;
            padding: 12px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .clear-btn:hover {
            background: #ee5a52;
        }

        .clear-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Words to Time Converter</h1>
        <p class="subtitle">Paste your text to estimate reading time</p>

        <div class="input-section">
            <label for="textInput">Paste or type your text:</label>
            <textarea
                id="textInput"
                placeholder="Paste your text here..."
            ></textarea>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Words</div>
                <div class="stat-value" id="wordCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Characters</div>
                <div class="stat-value" id="charCount">0</div>
            </div>
        </div>

        <div class="time-display">
            <div class="time-label">Estimated Reading Time</div>
            <div class="time-value" id="timeDisplay">0m 0s</div>
            <div class="reading-speed">Based on 200 words per minute</div>
        </div>

        <button class="clear-btn" onclick="clearText()">Clear Text</button>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const wordCountEl = document.getElementById('wordCount');
        const charCountEl = document.getElementById('charCount');
        const timeDisplayEl = document.getElementById('timeDisplay');

        // Average reading speed (words per minute)
        const WORDS_PER_MINUTE = 200;

        function countWords(text) {
            if (!text.trim()) return 0;
            // Split by whitespace and filter out empty strings
            return text.trim().split(/\s+/).filter(word => word.length > 0).length;
        }

        function calculateReadingTime(wordCount) {
            if (wordCount === 0) return { minutes: 0, seconds: 0 };

            const totalMinutes = wordCount / WORDS_PER_MINUTE;
            const minutes = Math.floor(totalMinutes);
            const seconds = Math.round((totalMinutes - minutes) * 60);

            return { minutes, seconds };
        }

        function updateStats() {
            const text = textInput.value;
            const wordCount = countWords(text);
            const charCount = text.length;
            const { minutes, seconds } = calculateReadingTime(wordCount);

            wordCountEl.textContent = wordCount.toLocaleString();
            charCountEl.textContent = charCount.toLocaleString();
            timeDisplayEl.textContent = `${minutes}m ${seconds}s`;
        }

        function clearText() {
            textInput.value = '';
            updateStats();
            textInput.focus();
        }

        // Update stats on input
        textInput.addEventListener('input', updateStats);

        // Initialize on page load
        updateStats();
    </script>
</body>
</html>
