<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Words to Time Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 10px;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            color: #333;
            font-size: 24px;
            font-weight: bold;
        }

        .time-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        .time-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .time-value {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .reading-speed {
            font-size: 12px;
            opacity: 0.8;
        }

        .clear-btn {
            width: 100%;
            padding: 12px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .clear-btn:hover {
            background: #ee5a52;
        }

        .clear-btn:active {
            transform: scale(0.98);
        }

        .config-card {
            background: #fff3e0;
            border: 2px solid #ffb74d;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .config-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            color: #e65100;
        }

        .config-icon {
            font-size: 20px;
            margin-right: 10px;
        }

        .config-title {
            font-size: 16px;
            font-weight: 600;
        }

        .config-control {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .wpm-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .wpm-label {
            color: #666;
            font-size: 14px;
        }

        .wpm-value {
            color: #e65100;
            font-size: 24px;
            font-weight: bold;
        }

        .wpm-slider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #ffe0b2;
            outline: none;
            -webkit-appearance: none;
        }

        .wpm-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff9800;
            cursor: pointer;
            transition: background 0.3s;
        }

        .wpm-slider::-webkit-slider-thumb:hover {
            background: #f57c00;
        }

        .wpm-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff9800;
            cursor: pointer;
            border: none;
            transition: background 0.3s;
        }

        .wpm-slider::-moz-range-thumb:hover {
            background: #f57c00;
        }

        .wpm-presets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .preset-btn {
            padding: 6px 12px;
            background: white;
            border: 2px solid #ffb74d;
            border-radius: 8px;
            color: #e65100;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .preset-btn:hover {
            background: #ffb74d;
            color: white;
        }

        .preset-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Words to Time Converter</h1>
        <p class="subtitle">Paste your text to estimate reading time</p>

        <div class="input-section">
            <label for="textInput">Paste or type your text:</label>
            <textarea
                id="textInput"
                placeholder="Paste your text here..."
            ></textarea>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Words</div>
                <div class="stat-value" id="wordCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Characters</div>
                <div class="stat-value" id="charCount">0</div>
            </div>
        </div>

        <div class="config-card">
            <div class="config-header">
                <span class="config-icon">⚙️</span>
                <span class="config-title">Reading Speed Configuration</span>
            </div>
            <div class="config-control">
                <div class="wpm-display">
                    <span class="wpm-label">Words per minute:</span>
                    <span class="wpm-value" id="wpmValue">200</span>
                </div>
                <input
                    type="range"
                    id="wpmSlider"
                    class="wpm-slider"
                    min="100"
                    max="400"
                    value="200"
                    step="10"
                >
                <div class="wpm-presets">
                    <button class="preset-btn" onclick="setWPM(150)">Slow (150)</button>
                    <button class="preset-btn" onclick="setWPM(200)">Average (200)</button>
                    <button class="preset-btn" onclick="setWPM(250)">Fast (250)</button>
                    <button class="preset-btn" onclick="setWPM(300)">Very Fast (300)</button>
                </div>
            </div>
        </div>

        <div class="time-display">
            <div class="time-label">Estimated Reading Time</div>
            <div class="time-value" id="timeDisplay">0m 0s</div>
            <div class="reading-speed" id="readingSpeed">Based on 200 words per minute</div>
        </div>

        <button class="clear-btn" onclick="clearText()">Clear Text</button>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const wordCountEl = document.getElementById('wordCount');
        const charCountEl = document.getElementById('charCount');
        const timeDisplayEl = document.getElementById('timeDisplay');
        const readingSpeedEl = document.getElementById('readingSpeed');
        const wpmSlider = document.getElementById('wpmSlider');
        const wpmValueEl = document.getElementById('wpmValue');

        // Reading speed (words per minute) - configurable
        let wordsPerMinute = 200;

        function countWords(text) {
            if (!text.trim()) return 0;
            // Split by whitespace and filter out empty strings
            return text.trim().split(/\s+/).filter(word => word.length > 0).length;
        }

        function calculateReadingTime(wordCount) {
            if (wordCount === 0) return { minutes: 0, seconds: 0 };

            const totalMinutes = wordCount / wordsPerMinute;
            const minutes = Math.floor(totalMinutes);
            const seconds = Math.round((totalMinutes - minutes) * 60);

            return { minutes, seconds };
        }

        function updateStats() {
            const text = textInput.value;
            const wordCount = countWords(text);
            const charCount = text.length;
            const { minutes, seconds } = calculateReadingTime(wordCount);

            wordCountEl.textContent = wordCount.toLocaleString();
            charCountEl.textContent = charCount.toLocaleString();
            timeDisplayEl.textContent = `${minutes}m ${seconds}s`;
        }

        function updateWPM() {
            wordsPerMinute = parseInt(wpmSlider.value);
            wpmValueEl.textContent = wordsPerMinute;
            readingSpeedEl.textContent = `Based on ${wordsPerMinute} words per minute`;
            updateStats();
        }

        function setWPM(wpm) {
            wpmSlider.value = wpm;
            updateWPM();
        }

        function clearText() {
            textInput.value = '';
            updateStats();
            textInput.focus();
        }

        // Update stats on input
        textInput.addEventListener('input', updateStats);

        // Update WPM when slider changes
        wpmSlider.addEventListener('input', updateWPM);

        // Initialize on page load
        updateStats();
    </script>
</body>
</html>
